<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample HTML Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f6f8;
        }
        h1 {
            color: #2c3e50;
        }
        p {
            color: #555;
            line-height: 1.6;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            max-width: 600px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Welcome</h1>
        <p>This is a sample HTML file.</p>
        <p>You can edit this template to suit your needs.</p>
        <button onclick="alert('Hello!')">Click Me</button>
    </div>

</body>
</html>
